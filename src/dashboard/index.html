<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HoursWatch — Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="header"></div>
      <div id="alert" role="alert" hidden></div>
      <main>
        <section class="panel" aria-labelledby="h-summary">
          <h2 id="h-summary" class="sr-only">Daily summary</h2>
          <div id="summary" class="cards"></div>
        </section>
        <section class="panel" aria-labelledby="h-timeline">
          <h2 id="h-timeline">24-hour timeline</h2>
          <div id="timeline"></div>
          <div id="details" hidden></div>
          <div id="week" hidden></div>
        </section>
        <div class="two-col">
          <section class="panel" aria-labelledby="h-breakdown">
            <div id="breakdown"></div>
          </section>
          <section class="panel" aria-labelledby="h-history">
            <div id="history"></div>
          </section>
        </div>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
